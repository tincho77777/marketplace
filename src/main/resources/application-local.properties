# =========================
# Overrides para ejecución LOCAL
# Estos valores sobreescriben los que vienen de Vault (que usa hostnames Docker)
# =========================

# Vault local
spring.cloud.vault.uri=http://localhost:8200

# DATASOURCE - apunta a localhost en lugar del hostname Docker "postgres"
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres

# REDIS - apunta a localhost en lugar del hostname Docker "redis"
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RABBITMQ - apunta a localhost en lugar del hostname Docker "rabbitmq"
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# AWS SQS (LocalStack)
aws.sqs.endpoint=http://localhost:4566

