# =========================
# VAULT para credenciales
# =========================
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=myroot
spring.cloud.vault.authentication=token
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret

spring.config.import=optional:vault://secret/marketplace/database,\
  optional:vault://secret/marketplace/redis,\
  optional:vault://secret/marketplace/rabbitmq,\
  optional:vault://secret/marketplace/aws, \
  optional:vault://secret/marketplace/external-apis

spring.application.name=marketplace

# =========================
# DATASOURCE - H2
# =========================
#spring.datasource.url=jdbc:h2:mem:marketplace
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
#spring.jpa.defer-datasource-initialization=true

# =========================
# DATASOURCE - POSTGRES
# =========================
#comentadas por ser secrets en Vault, las deje solo para recordar
#spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
#spring.datasource.username=postgres
#spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================
# REDIS
# =========================
#spring.data.redis.host=localhost
#spring.data.redis.port=6379

# =========================
# CACHE
# =========================
spring.cache.type=redis
# El TTL se configura directamente en el bean RedisCacheManager (RedisConfig.java ? entryTtl)
# La propiedad spring.cache.redis.time-to-live no tiene efecto cuando se define un bean RedisCacheManager propio

# =========================
# RABBITMQ
# =========================
#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=admin
#spring.rabbitmq.password=admin

# fuerza la conexion al arrancar la api, colocar en false una vez probado
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.template.mandatory=true

# nombres de exchange, queue y routing key como propiedades
rabbitmq.exchange=marketplace.exchange
rabbitmq.queue=product.created.queue
rabbitmq.routing-key=product.created

# =========================
# RESILIENCE4J - CIRCUIT BREAKER - RABBITMQ
# =========================
resilience4j.circuitbreaker.instances.rabbitmq.sliding-window-size=10
resilience4j.circuitbreaker.instances.rabbitmq.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.rabbitmq.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.rabbitmq.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.rabbitmq.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.rabbitmq.register-health-indicator=true

# =========================
# RESILIENCE4J - RETRY
# =========================
resilience4j.retry.instances.rabbitmq.max-attempts=3
resilience4j.retry.instances.rabbitmq.wait-duration=1s
resilience4j.retry.instances.rabbitmq.enable-exponential-backoff=true
resilience4j.retry.instances.rabbitmq.exponential-backoff-multiplier=2

# para ver el estado del circuit breaker
management.endpoint.env.show-values=NEVER

# =========================
# LOGGING - VAULT (debug para verificar que carga secrets)
# =========================
logging.level.org.springframework.cloud.vault=DEBUG
logging.level.org.springframework.vault=DEBUG

# =========================
# AWS SQS (LocalStack)
# =========================
#aws.sqs.endpoint=http://localhost:4566
#aws.sqs.region=us-east-1
#aws.sqs.queue-name=product-created-queue
#aws.sqs.queue-url=http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/product-created-queue
#aws.access-key=test
#aws.secret-key=test

# =========================
# RESILIENCE4J - CIRCUIT BREAKER - SQS
# =========================
resilience4j.circuitbreaker.instances.sqs.sliding-window-size=10
resilience4j.circuitbreaker.instances.sqs.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sqs.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sqs.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.sqs.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.sqs.register-health-indicator=true

# =========================
# RESILIENCE4J - RETRY - SQS
# =========================
resilience4j.retry.instances.sqs.max-attempts=3
resilience4j.retry.instances.sqs.wait-duration=1s
resilience4j.retry.instances.sqs.enable-exponential-backoff=true
resilience4j.retry.instances.sqs.exponential-backoff-multiplier=2

# =========================
# EXCHANGE RATE API
# =========================
exchange-rate.url=https://v6.exchangerate-api.com
#exchange-rate.api-key=848e46f7b20b6bdf9d887b8a

# =========================
# RESILIENCE4J - EXCHANGE RATE
# =========================
resilience4j.circuitbreaker.instances.exchangeRate.sliding-window-size=5
resilience4j.circuitbreaker.instances.exchangeRate.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.exchangeRate.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.exchangeRate.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.exchangeRate.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.exchangeRate.max-attempts=2
resilience4j.retry.instances.exchangeRate.wait-duration=2s

# =========================
# FAKE STORE API
# =========================
fake-store.url=https://fakestoreapi.com

# =========================
# ACTUATOR + MICROMETER
# =========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,retries,ratelimiters
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.health.circuitbreakers.enabled=true
management.health.redis.enabled=true
management.health.rabbit.enabled=true
management.health.db.enabled=true
management.health.ratelimiters.enabled=true

# tags globales que aparecen en todas las métricas
management.metrics.tags.application=marketplace-api
management.metrics.tags.environment=local

# =========================
# DISTRIBUTED TRACING
# =========================

# significa que el 100% de las requests se tracean. En producción usarías 0.1 (10%) para no saturar Zipkin.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# agrega el traceId y spanId a cada línea de log, así podés correlacionar logs con traces.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# =========================
# LOKI
# =========================
loki.url=http://localhost:3100

# =========================
# LOGGING - Debugging de Loki4j y Spring Cloud Sleuth
# =========================
logging.level.com.github.loki4j=DEBUG
logging.level.org.springframework.cloud.sleuth=DEBUG

# =========================
# RESILIENCE4J - RATE LIMITER (Limita cuántas requests puede hacer un cliente en un período de tiempo.)
# =========================
# significa 100 requests por segundo para el endpoint de productos.
resilience4j.ratelimiter.instances.products.limit-for-period=100
resilience4j.ratelimiter.instances.products.limit-refresh-period=1s
# significa que si se supera el límite, falla inmediatamente sin esperar.
resilience4j.ratelimiter.instances.products.timeout-duration=0s

# para importación solo 5 por segundo porque es una operación pesada.
resilience4j.ratelimiter.instances.import.limit-for-period=5
resilience4j.ratelimiter.instances.import.limit-refresh-period=1s
resilience4j.ratelimiter.instances.import.timeout-duration=0s

# =========================
# RESILIENCE4J - BULKHEAD
# =========================
# el bulkhead de products limita 20 llamadas concurrentes al endpoint de productos (para probar rate limiter subir el max-concurrent-calls mayor a 100).
resilience4j.bulkhead.instances.products.max-concurrent-calls=20
resilience4j.bulkhead.instances.products.max-wait-duration=0ms

# el de import tiene su propio pool de hilos separado del pool general de la app.
resilience4j.thread-pool-bulkhead.instances.import.core-thread-pool-size=3
resilience4j.thread-pool-bulkhead.instances.import.max-thread-pool-size=5
resilience4j.thread-pool-bulkhead.instances.import.queue-capacity=10

# =========================
# RESILIENCE4J - TIMEOUT
# =========================
resilience4j.timelimiter.instances.exchangeRate.timeout-duration=3s
resilience4j.timelimiter.instances.fakeStore.timeout-duration=5s