# =========================
# VAULT - Desactivado en Tests
# =========================
spring.cloud.vault.enabled=false
spring.config.import=

# =========================
# DATASOURCE - H2 (Tests)
# =========================
spring.datasource.url=jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================
# JPA / HIBERNATE (Tests)
# =========================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================
# FLYWAY - Desactivado en Tests
# =========================
spring.flyway.enabled=false

# =========================
# CACHE - Desactivado en Tests
# =========================
spring.cache.type=none

# =========================
# REDIS - Dummy values para Tests (no conecta realmente)
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =========================
# RABBITMQ - Dummy values para Tests
# =========================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

# =========================
# AWS SQS - Dummy values para Tests (no conecta realmente)
# =========================
aws.sqs.endpoint=http://localhost:4566
aws.sqs.region=us-east-1
aws.sqs.queue-name=product-created-queue
aws.sqs.queue-url=http://localhost:4566/000000000000/product-created-queue
aws.access-key=test
aws.secret-key=test

# =========================
# EXCHANGE RATE - Dummy values para Tests
# =========================
exchange-rate.api-key=test-key
exchange-rate.url=http://localhost:9999

# =========================
# APPLICATION NAME
# =========================
spring.application.name=marketplace

# =========================
# DISTRIBUTED TRACING (Desactivado en Tests)
# =========================
management.tracing.sampling.probability=0.0
management.zipkin.tracing.endpoint=http://localhost:9999/api/v2/spans

# =========================
# LOKI - Desactivado en Tests (dummy values)
# =========================
loki.url=http://localhost:3100

# =========================
# LOGGING - Tests
# =========================
logging.level.root=INFO
logging.level.com.github.loki4j=WARN
logging.level.org.springframework.cloud.sleuth=WARN
